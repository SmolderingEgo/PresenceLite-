name: Package and release

# Runs when VERSION changes on main (or by hand from the Actions tab).
# If tag v<VERSION> doesn't exist yet, it creates the tag and publishes a release
# with the addon zip and the release.json that WowUp reads.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag from VERSION
        id: tag
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Tag $v already exists, nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$v"
            git push origin "$v"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.tag.outputs.new == 'true'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
